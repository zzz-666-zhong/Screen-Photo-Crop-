name: Native desktop checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  desktop:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - name: Build WPF desktop
        run: dotnet build desktop/Crop.Desktop/Crop.Desktop.csproj -c Release
      - name: Verify geometry and batch behavior
        run: dotnet run --project desktop/Crop.Verify/Crop.Verify.csproj -c Release
